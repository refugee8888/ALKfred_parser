version: 2

models:
  - name: fact_therapy_disease
    columns:
      - name: doid
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_disease')   
                field: doid

      - name: ncit_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_therapy')   
                field: ncit_id
          - relationships:
              arguments:
                to: source('alkfred', 'civic_dim_therapy')
                field: ncit_id
                
    
      - name: n_resistant_evidence
        description: Number of evidence items labeled as RESISTANCE.

      - name: n_sensitive_evidence
        description: Number of evidence items labeled as SENSITIVITY.

      - name: n_total_evidence
        description: Total number of evidence items (resistant + sensitive + others).

      - name: n_resistant_variants
        description: >
          Number of distinct variants that have at least one RESISTANCE evidence item
          for this therapy-disease pair.

      - name: n_sensitive_variants
        description: >
          Number of distinct variants that have at least one SENSITIVITY evidence item
          for this therapy-disease pair.

      - name: resistance_rate
        description: n_resistant_evidence / n_total_evidence
      
      